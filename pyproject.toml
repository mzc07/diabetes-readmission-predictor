[project]
name = "diabetes-readmission-predictor"
version = "0.1.0"
description = "Predicción de reingreso hospitalario <30 días en pacientes diabéticos, con Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "streamlit",
    "joblib",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel", "nbconvert", "pre-commit"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]
