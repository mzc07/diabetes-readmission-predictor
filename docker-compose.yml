services:
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token= --ServerApp.password=
  app:
    build: .
    profiles: ["app"]
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro
    command: streamlit run app.py --server.address=0.0.0.0
